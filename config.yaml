# ============================================================================ #
#  Configuración compartida por Python y R.
#
#  Este archivo es la ÚNICA fuente de verdad. Python lo lee con `yaml.safe_load`
#  y R con `yaml::read_yaml`. Si una ruta, una semilla o una especificación de
#  modelo aparece hard-codeada en un script, es un bug.
# ============================================================================ #

proyecto:
  nombre: cvae-mode-choice
  # Todas las rutas son RELATIVAS a la raíz del repo. Nunca absolutas.
  # Python resuelve con pathlib; R con here::here().
  rutas:
    raw:        data/raw
    folds:      data/folds
    processed:  data/processed
    # Corrigendum (2026-10): los resultados nuevos van a una carpeta aparte.
    # Los validados del paper siguen en `results/` (versionados en git).
    results:    results/corrigendum
    logs:       logs

# ---------------------------------------------------------------------------- #
#  Semillas. Documentadas explícitamente para que cualquiera reproduzca los
#  mismos folds y las mismas muestras sintéticas.
# ---------------------------------------------------------------------------- #
semillas:
  folds:        42      # partición de la validación cruzada
  cvae_entrena: 1234    # inicialización de pesos del CVAE
  cvae_muestreo: 2024   # muestreo del espacio latente
  oversampling: 7       # ROS / SMOTE

# ---------------------------------------------------------------------------- #
#  Diseño experimental
# ---------------------------------------------------------------------------- #
validacion:
  n_splits: 5
  n_repeats: 10
  estratificado: true

metodos:
  - original        # sin balanceo (línea base, §2.2)
  - ROS
  - SMOTE
  - CVAE
  - class_weights   # §2.9 — pondera la verosimilitud, no genera datos

# ---------------------------------------------------------------------------- #
#  Datasets. `modelo` define la especificación de utilidades que consume Apollo;
#  `cvae` define cómo se generan los sintéticos.
# ---------------------------------------------------------------------------- #
datasets:

  sm_centro:
    archivo: sm_database.csv
    sep: ","
    id_col: ID
    choice_col: ICH
    clases: [1, 4, 5]

    modelo:
      asc_fija: asc_metro
      # Reescalado de covariables SOLO en la estimación/predicción del MNL
      # (R/apollo_modelo.R::aplicar_escalas). ILM sin escalar (media ≈ 42.800)
      # dejaba el Hessiano mal condicionado: Apollo reportaba "false
      # convergence" en 16–78 % de los folds. Con 1e-4, ILM se mide en decenas
      # de miles y b_mi_cd / b_mi_bus son el efecto en la utilidad por cada
      # 10.000 unidades de ILM (= 1e4 × el coeficiente publicado). Las
      # utilidades no cambian. No afecta folds, sintéticos ni JSD: el CVAE y
      # SMOTE siguen viendo ILM en su unidad original.
      escalas: {ILM: 1.0e-4}
      alternativas:
        - {id: 1, nombre: car_driver, avail: DISP1,
           atributos: {b_tcw: CTOT1_w, b_ivt: TVIA1, b_wkt: TCAM1,
                       b_autlic: AUTLIC, b_mi_cd: ILM}}
        - {id: 4, nombre: metro, avail: DISP4,
           atributos: {b_tcw: CTOT4_w, b_ivt: TVIA4, b_wkt: TCAM4,
                       b_wt: TESP4}}
        - {id: 5, nombre: bus, avail: DISP5,
           atributos: {b_tcw: CTOT5_w, b_ivt: TVIA5, b_wkt: TCAM5,
                       b_wt: TESP5, b_mi_bus: ILM}}
      signos_esperados: {b_ivt: -1, b_wkt: -1, b_wt: -1, b_tcw: -1}

    cvae:
      # Columnas que el CVAE NO debe modelar: identificadores, variables fuera
      # del modelo y atributos de los modos 2 y 3, que no forman parte de la
      # especificación de SM-Centro. Replica el `drop_cols` de los notebooks
      # originales. Se remuestrean de la distribución empírica por modo.
      excluir: [ID, JEFH, HTS,
                TVIA2, TCAM2, CTOT2_w, DISP2,
                TVIA3, TCAM3, TESP3, CTOT3_w, DISP3]
      variables:
        SEXO:   binary
        AUTLIC: empirical
        DISP1:  {tipo: availability, depende: [TVIA1, TCAM1, CTOT1_w]}
        DISP4:  {tipo: availability, depende: [TVIA4, TCAM4, TESP4, CTOT4_w]}
        DISP5:  {tipo: availability, depende: [TVIA5, TCAM5, TESP5, CTOT5_w]}
        TVIA1:  zero_inflated
        TVIA4:  zero_inflated
        TVIA5:  zero_inflated
        TCAM1:  zero_inflated
        TCAM4:  zero_inflated
        TCAM5:  zero_inflated
        TESP4:  zero_inflated
        TESP5:  zero_inflated
      arquitectura:
        n_z: 2
        encoder_dims: [13, 14]
        decoder_dim: 13
        batch_size: 64
        epochs: 120
        kl_warmup_epochs: 10
        learning_rate: 0.001      # ajustable por 07_hiperparametros.py
      generacion:
        balance_to: majority
        confianza_elipse: 0.80

  lc_centro:
    archivo: lc_database.csv
    sep: ","
    id_col: ID
    choice_col: ICH
    clases: [1, 2, 4, 5]

    modelo:
      asc_fija: asc_metro
      # Corrigendum (N10): ingreso en CD, CP y Bus, como declara la Tabla 4 del
      # paper y como se estimó la columna ORIG. publicada (reproducida exacta
      # con experimental/diagnostico_lc_orig.R). Es corrección a lo declarado,
      # no re-especificación. HH (jefe de hogar) NO entra: la Tabla 4 lo lista,
      # pero con HH la columna ORIG. publicada no se reproduce. Escala igual que
      # SM-Centro: b_mi_* por cada 10.000 de ILM.
      escalas: {ILM: 1.0e-4}
      alternativas:
        - {id: 1, nombre: car_driver, avail: DISP1,
           atributos: {b_tcw: CTOT1_w, b_ivt: TVIA1, b_wkt: TCAM1, b_autlic: AUTLIC,
                       b_mi_cd: ILM}}
        - {id: 2, nombre: car_passenger, avail: DISP2,
           atributos: {b_tcw: CTOT2_w, b_ivt: TVIA2, b_wkt: TCAM2, b_sex_cp: SEXO,
                       b_mi_cp: ILM}}
        - {id: 4, nombre: metro, avail: DISP4,
           atributos: {b_tcw: CTOT4_w, b_ivt: TVIA4, b_wkt: TCAM4, b_wt: TESP4}}
        - {id: 5, nombre: bus, avail: DISP5,
           atributos: {b_tcw: CTOT5_w, b_ivt: TVIA5, b_wkt: TCAM5, b_wt: TESP5,
                       b_mi_bus: ILM}}
      signos_esperados: {b_ivt: -1, b_wkt: -1, b_wt: -1, b_tcw: -1}

    cvae:
      # Ver nota en sm_centro. Las Condes usa los modos 1, 2, 4 y 5.
      excluir: [ID, JEFH, HTS,
                TVIA3, TCAM3, TESP3, CTOT3_w, DISP3]
      variables:
        SEXO:   binary
        AUTLIC: empirical
        DISP1:  {tipo: availability, depende: [TVIA1, TCAM1, CTOT1_w]}
        DISP2:  {tipo: availability, depende: [TVIA2, TCAM2, CTOT2_w]}
        DISP4:  {tipo: availability, depende: [TVIA4, TCAM4, TESP4, CTOT4_w]}
        DISP5:  {tipo: availability, depende: [TVIA5, TCAM5, TESP5, CTOT5_w]}
      arquitectura:
        n_z: 2
        encoder_dims: [13, 6]
        decoder_dim: 13
        batch_size: 16
        epochs: 120
        kl_warmup_epochs: 0
        learning_rate: 0.001      # ajustable por 07_hiperparametros.py
      generacion:
        balance_to: majority
        confianza_elipse: 0.80

  whalen:
    archivo: whalen_database.csv
    sep: " "
    id_col: RespondentID
    choice_col: choice
    clases: [1, 2, 3, 4]

    modelo:
      # Especificación tomada de MNL_WHALEN__Systematic_.R (apollo_probabilities).
      # Cada modo tiene su propio coeficiente de tiempo (b_tc, b_tw, b_th, b_ttc):
      # no son genéricos. Lo mismo para solo/shared/densidades.
      asc_fija: asc_cycling
      alternativas:
        - {id: 1, nombre: cycling, avail: avcycle,
           atributos: {b_tc: timecycle}}
        - {id: 2, nombre: walking, avail: avwalk,
           atributos: {b_tw: timewalk, b_lsw: solo, b_lshw: shared,
                       b_sdw: st_den, b_swd: side_den}}
        - {id: 3, nombre: hsr, avail: avhsr,
           atributos: {b_th: timehsr, b_lsh: solo, b_lshh: shared,
                       b_sh: Shelters_A, b_at: accesshsr,
                       b_sdh: st_den, b_swdh: side_den}}
        - {id: 4, nombre: car, avail: avcar,
           atributos: {b_ttc: timecar, b_lsc: solo, b_lshc: shared,
                       b_sdc: st_den, b_swdc: side_den, b_parking: parking}}
      # Tiempos de viaje y de acceso: negativos por teoría. Este dataset no
      # tiene variable de costo, así que no se puede calcular el valor del tiempo.
      signos_esperados: {b_tc: -1, b_tw: -1, b_th: -1, b_ttc: -1, b_at: -1}

    cvae:
      excluir: [RespondentID]
      variables:
        avcycle: {tipo: availability, depende: [timecycle]}
        avwalk:  {tipo: availability, depende: [timewalk]}
        avhsr:   {tipo: availability, depende: [timehsr, accesshsr]}
        avcar:   {tipo: availability, depende: [timecar]}
        parking: binary
        solo: binary
        shared: binary
        Shelters_A: binary
      arquitectura:
        n_z: 2
        encoder_dims: [14, 5]
        decoder_dim: 9 
        batch_size: 16
        epochs: 120
        kl_warmup_epochs: 20
        learning_rate: 0.001      # ajustable por 07_hiperparametros.py
      generacion:
        balance_to: majority
        confianza_elipse: 0.80

  swissmetro:
    archivo: swissmetro.csv
    sep: ";"
    id_col: ID
    choice_col: CHOICE
    clases: [1, 2, 3]
    # OJO: el script de Apollo filtraba AGE != 6 y el notebook del CVAE no.
    # Aquí el filtro es explícito y lo aplican AMBOS lados.
    filtros:
      - "AGE != 6"
    # D3 (corrigendum): el CSV crudo no trae CAR_AV. El auto no está
    # disponible en 1.674 filas, codificadas como CAR_TT = CAR_CO = 0 (igual
    # que Biogeme con CAR_AV = 0; en los reales ambos ceros coinciden siempre).
    # 01_folds.py agrega la columna a {ds}_original.csv. No quita filas
    # (N = 10.710).
    derivadas:
      CAR_AV: "CAR_TT > 0"
      # G1 (corrigendum): en el crudo, TRAIN_CO y SM_CO de quien tiene abono
      # anual (GA = 1) son el PRECIO DEL ABONO (1.286–5.040 CHF), no el costo
      # marginal del viaje, que para él es 0. Convención de Biogeme:
      # costo = CO * (GA == 0). El modelo usa estas columnas y no las crudas.
      TRAIN_COST: "TRAIN_CO * (GA == 0)"
      SM_COST: "SM_CO * (GA == 0)"
    # En las filas SINTÉTICAS cada variable con `depende` es binaria y está
    # acoplada a sus ceros estructurales: si CAR_AV = 0, CAR_TT = CAR_CO = 0;
    # si GA = 1, TRAIN_COST = SM_COST = 0 (`anula_si: 1`).
    # El CVAE ya lo hace (propagate_structural_zeros) y ROS copia filas; con
    # esta bandera SMOTE redondea la variable interpolada y propaga los ceros,
    # y 02_sinteticos.py ABORTA si algún
    # método deja una fila sin acoplar.
    acoplar_disponibilidad: true

    modelo:
      asc_fija: asc_train
      alternativas:
        - { id: 1, nombre: train, avail: null,
            atributos: { b_time: TRAIN_TT, b_cost: TRAIN_COST, b_ga: GA } }
        - { id: 2, nombre: sm,    avail: null,
            atributos: { b_time: SM_TT, b_cost: SM_COST, b_ga: GA, b_seats: SM_SEATS } }
        - { id: 3, nombre: car,   avail: CAR_AV,
            atributos: { b_time: CAR_TT, b_cost: CAR_CO, b_age: AGE, b_luggage: LUGGAGE } }
      signos_esperados: { b_time: -1, b_cost: -1 }

    cvae:
      # TRAIN_CO y SM_CO crudos quedan fuera del CVAE (el MNL usa *_COST);
      # se remuestrean de la empírica por modo, como el resto de `excluir`.
      excluir: [ID, TRAIN_CO, SM_CO]
      variables:
        CAR_AV:  {tipo: availability, depende: [CAR_TT, CAR_CO]}
        AGE: empirical
        LUGGAGE: empirical
        GA: {tipo: binary, depende: [TRAIN_COST, SM_COST], anula_si: 1}
        SM_SEATS: binary
      arquitectura:
        n_z: 2
        encoder_dims: [14, 5]
        decoder_dim: 9
        batch_size: 16
        epochs: 120
        kl_warmup_epochs: 20
        learning_rate: 0.001      # ajustable por 07_hiperparametros.py
      generacion:
        balance_to: majority
        confianza_elipse: 0.80

# ---------------------------------------------------------------------------- #
#  Tablas del paper (python/scripts/14_tablas_paper.py). Solo PRESENTACIÓN:
#  etiquetas, orden y qué celda va en cada tabla, tal como en
#  docs/Paper_Aceptado_TRR_CVAE.pdf. Ningún número sale de aquí.
# ---------------------------------------------------------------------------- #
paper:
  destino: tablas_paper
  # Datasets del paper, en su orden (Whalen no está en el paper).
  datasets:
    sm_centro: SM-Centro
    lc_centro: LC-Centro
    swissmetro: Swissmetro
  # Métodos y etiquetas en el orden de las Tablas 8 y 9.
  metodos:
    original: Original (no balancing)
    CVAE: CVAE
    ROS: ROS
    SMOTE: SMOTE
    class_weights: Class-weighting
  # Encabezados cortos y orden de columnas de la Tabla 11.
  metodos_cortos: {ROS: ROS, SMOTE: SMOTE, CVAE: CVAE, class_weights: Class-w.}
  tabla_11_metodos: [ROS, SMOTE, CVAE, class_weights]
  # Nombre de cada modo (id del modelo -> etiqueta del paper, Tabla 2).
  modos:
    sm_centro: {1: Car Driver (CD), 4: Metro, 5: Bus}
    lc_centro: {1: Car Driver (CD), 2: Car Passenger (CP), 4: Metro, 5: Bus}
    swissmetro: {1: Train, 2: Swiss-metro, 3: Car}
  # Tabla 6: ROS, SMOTE y CVAE balancean al mismo objetivo; se toma uno y el
  # script verifica que los tres coincidan.
  tabla_06_metodo: CVAE
  tabla_07_metodos: [ROS, SMOTE, CVAE]
  # Tabla 9 (corrigendum): elasticidad PROPIA en SM-Centro, media ± SD sobre
  # las particiones. La espera (Metro, Bus) es la reversión sistemática del
  # CVAE; el tiempo de viaje del auto se mantiene para documentar que el
  # +0,014 publicado no es robusto (N9). La covariable sale de la utilidad:
  # atributo `coeficiente` de la alternativa `alternativa`.
  tabla_09:
    dataset: sm_centro
    columnas:
      - {etiqueta: "Own-elasticity of waiting time (Metro)", alternativa: 4, coeficiente: b_wt}
      - {etiqueta: "Own-elasticity of waiting time (Bus)", alternativa: 5, coeficiente: b_wt}
      - {etiqueta: "Own-elasticity of travel time", alternativa: 1, coeficiente: b_ivt}
  # Tabla 11: parámetro del modelo -> fila del paper, en el orden del paper.
  # El ASC fijo (modelo.asc_fija) no se reporta. b_mi_* (SM y LC) no estaba en
  # la Tabla 11 publicada pero sí en la especificación (Tabla 4).
  coeficientes:
    sm_centro:
      asc_car_driver: Car Driver ASC
      asc_bus: Bus ASC
      b_ivt: Travel Time
      b_wkt: Walking Time
      b_wt: Waiting Time
      b_tcw: Travel Cost
      b_autlic: AUTLIC
      b_mi_cd: Monthly Income (CD)
      b_mi_bus: Monthly Income (Bus)
    lc_centro:
      asc_car_driver: Car Driver ASC
      asc_car_passenger: Car Pass. ASC
      asc_bus: Bus ASC
      b_ivt: Travel Time
      b_wkt: Walking Time
      b_wt: Waiting Time
      b_tcw: Travel Cost
      b_sex_cp: SEX (CP)
      b_autlic: AUTLIC
      b_mi_cd: Monthly Income (CD)
      b_mi_cp: Monthly Income (CP)
      b_mi_bus: Monthly Income (Bus)
    swissmetro:
      asc_car: Car ASC
      asc_sm: SM ASC
      b_cost: Travel Cost
      b_time: Travel Time
      b_age: Age
      b_luggage: Luggage
      b_ga: GA
      b_seats: Seats
